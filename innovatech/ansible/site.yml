---
# ==============================================================================
# Play 1: Common Node Preparation (All Nodes)
# Sets up kernel modules, sysctl, containerd CNI paths, storage packages, and Kube binaries
# ==============================================================================
- name: Prepare all cluster nodes
  hosts: all
  become: true
  tasks:
    - name: Load required kernel modules for Kubernetes & Containerd
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter

    - name: Persist kernel modules across reboots
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter
        mode: "0644"

    - name: Configure sysctl parameters for Kubernetes networking
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
        sysctl_file: /etc/sysctl.d/99-kubernetes-cri.conf
      loop:
        - { name: 'net.bridge.bridge-nf-call-iptables', value: '1' }
        - { name: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
        - { name: 'net.ipv4.ip_forward', value: '1' }

    - name: Fix containerd CNI directory paths in config.toml
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backrefs: true
      loop:
        - { regexp: '^(\s*)bin_dir\s*=.*', line: '\1bin_dir = "/opt/cni/bin"' }
        - { regexp: '^(\s*)conf_dir\s*=.*', line: '\1conf_dir = "/etc/cni/net.d"' }
      notify: Restart containerd

    - name: Install Longhorn node prerequisites
      ansible.builtin.apt:
        name:
          - open-iscsi
          - nfs-common
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Ensure iscsid service is enabled and active
      ansible.builtin.systemd:
        name: iscsid
        enabled: true
        state: started

    - name: Ensure keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        mode: "0644"

    - name: Configure Kubernetes apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/kubernetes.sources
        content: |
          Types: deb
          URIs: https://pkgs.k8s.io/core:/stable:/v1.37/deb/
          Suites: /
          Signed-By: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
          Trusted: yes
        mode: "0644"

    - name: Install Kubernetes components
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes packages at current version
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd:
        name: containerd
        state: restarted

# ==============================================================================
# Play 2: Initialize Control Plane & CNI
# ==============================================================================
- name: Initialize Kubernetes Control Plane
  hosts: control_plane
  become: true
  vars:
    pod_network_cidr: "10.244.0.0/16"
  tasks:
    - name: Run kubeadm init
      ansible.builtin.command:
        cmd: >
          kubeadm init
          --token={{ k8s_token }}
          --token-ttl=0
          --pod-network-cidr={{ pod_network_cidr }}
          --apiserver-advertise-address={{ ansible_host }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Create local user .kube directory
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy admin.conf to local user kubeconfig
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

    - name: Fetch kubeconfig to local management host
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "./kubeconfig"
        flat: true

    - name: Compute discovery CA certificate hash
      ansible.builtin.shell: >
        openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt |
        openssl rsa -pubin -outform der 2>/dev/null |
        openssl dgst -sha256 -hex | sed 's/^.* //'
      register: ca_cert_hash
      changed_when: false

    - name: Expose CA hash as fact across plays
      ansible.builtin.set_fact:
        discovery_ca_hash: "{{ ca_cert_hash.stdout }}"

    - name: Install Calico Tigera Operator
      ansible.builtin.command:
        cmd: kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/tigera-operator.yaml --kubeconfig=/etc/kubernetes/admin.conf
      register: calico_operator
      failed_when: calico_operator.rc != 0 and 'already exists' not in calico_operator.stderr
      changed_when: "'created' in calico_operator.stdout"

    - name: Template Calico Installation Custom Resource
      ansible.builtin.copy:
        dest: /tmp/calico-installation.yaml
        content: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
              - cidr: {{ pod_network_cidr }}
                encapsulation: VXLANCrossSubnet
        mode: "0644"

    - name: Apply Calico Installation CR
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/calico-installation.yaml --kubeconfig=/etc/kubernetes/admin.conf
      register: calico_apply
      changed_when: "'created' in calico_apply.stdout or 'configured' in calico_apply.stdout"

# ==============================================================================
# Play 3: Join Worker Nodes
# ==============================================================================
- name: Join Worker Nodes to Cluster
  hosts: workers
  become: true
  vars:
    control_plane_ip: "{{ hostvars[groups['control_plane'][0]]['ansible_host'] }}"
    join_hash: "{{ hostvars[groups['control_plane'][0]]['discovery_ca_hash'] }}"
  tasks:
    - name: Execute kubeadm join
      ansible.builtin.command:
        cmd: >
          kubeadm join {{ control_plane_ip }}:6443
          --token={{ k8s_token }}
          --discovery-token-ca-cert-hash=sha256:{{ join_hash }}
      args:
        creates: /etc/kubernetes/kubelet.conf

# ==============================================================================
# Play 4: Deploy & Configure Longhorn
# ==============================================================================
- name: Install and Configure Longhorn Distributed Storage
  hosts: control_plane
  become: true
  vars:
    longhorn_version: "v1.12.1"
  tasks:
    - name: Untaint control-plane node (enable workload & storage scheduling)
      ansible.builtin.command:
        cmd: kubectl taint nodes --all node-role.kubernetes.io/control-plane- --kubeconfig=/etc/kubernetes/admin.conf
      register: taint_result
      failed_when: taint_result.rc != 0 and 'not found' not in taint_result.stderr
      changed_when: "'untainted' in taint_result.stdout"

    - name: Deploy Longhorn manifests
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f https://raw.githubusercontent.com/longhorn/longhorn/{{ longhorn_version }}/deploy/longhorn.yaml
          --kubeconfig=/etc/kubernetes/admin.conf
      register: longhorn_install
      changed_when: "'created' in longhorn_install.stdout or 'configured' in longhorn_install.stdout"

    - name: Await rollout of Longhorn Manager DaemonSet
      ansible.builtin.command:
        cmd: kubectl rollout status daemonset/longhorn-manager -n longhorn-system --timeout=300s --kubeconfig=/etc/kubernetes/admin.conf
      changed_when: false

    - name: Wait for default Longhorn StorageClass to be created
      ansible.builtin.command:
        cmd: kubectl get storageclass longhorn --kubeconfig=/etc/kubernetes/admin.conf
      register: sc_check
      retries: 20
      delay: 5
      until: sc_check.rc == 0
      changed_when: false

    - name: Remove default flag from stock Longhorn StorageClass
      ansible.builtin.command:
        cmd: >
          kubectl annotate storageclass longhorn
          storageclass.kubernetes.io/is-default-class="false"
          --overwrite
          --kubeconfig=/etc/kubernetes/admin.conf
      changed_when: true

    - name: Template custom default Longhorn StorageClass
      ansible.builtin.copy:
        dest: /tmp/longhorn-retain-sc.yaml
        content: |
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: longhorn-retain
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
          provisioner: driver.longhorn.io
          allowVolumeExpansion: true
          reclaimPolicy: Retain
          volumeBindingMode: Immediate
          parameters:
            numberOfReplicas: "3"
            staleReplicaTimeout: "30"
            fromBackup: ""
        mode: "0644"

    - name: Deploy custom default Longhorn StorageClass
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/longhorn-retain-sc.yaml --kubeconfig=/etc/kubernetes/admin.conf
      register: deploy_custom_sc
      changed_when: "'created' in deploy_custom_sc.stdout or 'configured' in deploy_custom_sc.stdout"

    - name: Install nginx ingress controller
      ansible.builtin.command:
        cmd: >
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.0/deploy/static/provider/baremetal/deploy.yaml
          --kubeconfig=/etc/kubernetes/admin.conf
      register: ingress_install
      changed_when: "'created' in ingress_install.stdout or 'configured' in ingress_install.stdout"

### ==============================================================================
### Play 5: Node Storage Preparation (All Nodes)
### Prepares secondary physical disks for Longhorn distributed storage pool
### ==============================================================================
- name: Prepare secondary storage disks for Longhorn
  hosts: all
  become: true
  vars:
    expected_disk_size_gib: 100
    disk_size_tolerance_gib: 10
    mount_point: "/mnt/longhorn-storage"
    filesystem_type: "ext4"
  tasks:
    - name: Ensure disk management utilities are installed
      ansible.builtin.apt:
        name:
          - parted
          - e2fsprogs
        state: present

    - name: Gather block device info
      ansible.builtin.command:
        cmd: lsblk -J -b -o NAME,SIZE,TYPE,MOUNTPOINT
      register: lsblk_raw
      changed_when: false

    - name: Parse block devices
      ansible.builtin.set_fact:
        block_devices: "{{ (lsblk_raw.stdout | from_json).blockdevices }}"
  
    - name: Identify the correct storage disk by size and unmounted state
      ansible.builtin.set_fact:
        candidate_disks: "{{ candidate_disks_tmp }}"
      vars:
        candidate_disks_tmp: >-
          {%- set results = [] -%}
          {%- for dev in block_devices -%}
            {%- if dev.type == 'disk' and dev.mountpoint is none
                  and (dev.size | int) >= ((expected_disk_size_gib - disk_size_tolerance_gib) * 1073741824)
                  and (dev.size | int) <= ((expected_disk_size_gib + disk_size_tolerance_gib) * 1073741824) -%}
              {%- set _ = results.append(dev) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ results }}
      failed_when: candidate_disks | length != 1

    - name: Set storage_disk fact from discovered device
      ansible.builtin.set_fact:
        storage_disk: "/dev/{{ candidate_disks[0].name }}"

    - name: Set storage_disk fact from discovered device
      ansible.builtin.set_fact:
        storage_disk: "/dev/{{ candidate_disks[0].name }}"

    - name: Create ext4 filesystem directly on secondary disk
      community.general.filesystem:
        fstype: "{{ filesystem_type }}"
        dev: "{{ storage_disk }}"
        force: false

    - name: Ensure Longhorn storage mount directory exists
      ansible.builtin.file:
        path: "{{ mount_point }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Mount disk and persist in /etc/fstab
      ansible.posix.mount:
        path: "{{ mount_point }}"
        src: "{{ storage_disk }}"
        fstype: "{{ filesystem_type }}"
        opts: defaults,noatime
        state: mounted


### ==============================================================================
### Play 6: Declarative Longhorn Node Storage Allocation
### Registers /mnt/longhorn-storage and disables OS root drive scheduling
### ==============================================================================
- name: Configure Longhorn storage paths
  hosts: control_plane
  become: true
  tags: longhorn-disks
 
  vars:
    mount_point: "/mnt/longhorn-storage"
    extra_disk_key: "extra-disk"
    cluster_nodes:
      - ehv2-prod-k8s-0001
      - ehv2-prod-k8s-0002
      - ehv2-prod-k8s-0003
  tasks:
    - name: Ensure jq is installed
      ansible.builtin.apt:
        name: jq
        state: present
 
    # NOTE: previously this filter selected disks by `.path ==
    # "{{ mount_point }}"` to disable the OS root disk's scheduling. Because
    # the new "extra-disk" entry is added to the *same* document earlier in
    # the pipe, and it uses that same mount_point as its path, the select()
    # matched the disk we had just enabled and immediately disabled it again
    # -- leaving zero schedulable disks and causing PVCs (e.g. Postgres) to
    # get stuck in ContainerCreating. Fixed by keying off the disk's map key
    # instead of its path, so only the pre-existing default disk (whatever
    # its path) gets scheduling disabled, and "extra-disk" is left alone.
    - name: Register extra disk and disable scheduling on all other disks
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          kubectl get nodes.longhorn.io {{ item }} -n longhorn-system -o json --kubeconfig=/etc/kubernetes/admin.conf | jq '
            .spec.disks["{{ extra_disk_key }}"] = {
              "allowScheduling": true,
              "evictionRequested": false,
              "path": "{{ mount_point }}",
              "storageReserved": 0,
              "tags": []
            } |
            .spec.disks |= (to_entries
              | map(if .key != "{{ extra_disk_key }}"
                    then .value.allowScheduling = false
                    else . end)
              | from_entries)
          ' | kubectl apply -f - --kubeconfig=/etc/kubernetes/admin.conf
        executable: /bin/bash
      loop: "{{ cluster_nodes }}"
 
    - name: Fetch kubeconfig to local management host
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "./kubeconfig"
        flat: true
 