---
- name: Initialize Kubernetes control plane
  hosts: control_plane
  become: true
  vars:
    pod_network_cidr: "10.244.0.0/16"
  tasks:
    - name: Run kubeadm init
      ansible.builtin.command:
        cmd: >
          kubeadm init
          --token={{ k8s_token }}
          --token-ttl=0
          --pod-network-cidr={{ pod_network_cidr }}
          --apiserver-advertise-address={{ ansible_host }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Set up kubeconfig for the connecting user
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy admin.conf into place
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        mode: "0600"

    - name: Fetch kubeconfig locally for your own kubectl
      ansible.builtin.fetch:
        src: /etc/kubernetes/admin.conf
        dest: "./kubeconfig"
        flat: true

    - name: Compute CA cert hash for worker join
      ansible.builtin.shell: >
        openssl x509 -pubkey -in /etc/kubernetes/pki/ca.crt |
        openssl rsa -pubin -outform der 2>/dev/null |
        openssl dgst -sha256 -hex | sed 's/^.* //'
      register: ca_cert_hash
      changed_when: false

    - name: Expose hash to the workers play
      ansible.builtin.set_fact:
        discovery_ca_hash: "{{ ca_cert_hash.stdout }}"

    - name: Install Calico (operator)
      ansible.builtin.command:
        cmd: kubectl create -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.0/manifests/tigera-operator.yaml --kubeconfig=/etc/kubernetes/admin.conf
      register: calico_operator
      failed_when: calico_operator.rc != 0 and 'already exists' not in calico_operator.stderr
      changed_when: "'created' in calico_operator.stdout"

    - name: Configure Calico pod CIDR via Installation CR
      ansible.builtin.copy:
        dest: /tmp/calico-installation.yaml
        content: |
          apiVersion: operator.tigera.io/v1
          kind: Installation
          metadata:
            name: default
          spec:
            calicoNetwork:
              ipPools:
              - cidr: {{ pod_network_cidr }}
                encapsulation: VXLANCrossSubnet

    - name: Apply Calico Installation CR
      ansible.builtin.command:
        cmd: kubectl apply -f /tmp/calico-installation.yaml --kubeconfig=/etc/kubernetes/admin.conf
      changed_when: true

- name: Join worker nodes to cluster
  hosts: workers
  become: true
  vars:
    control_plane_ip: "{{ hostvars[groups['control_plane'][0]]['ansible_host'] }}"
    join_hash: "{{ hostvars[groups['control_plane'][0]]['discovery_ca_hash'] }}"
  tasks:
    - name: Run kubeadm join
      ansible.builtin.command:
        cmd: >
          kubeadm join {{ control_plane_ip }}:6443
          --token={{ k8s_token }}
          --discovery-token-ca-cert-hash=sha256:{{ join_hash }}
      args:
        creates: /etc/kubernetes/kubelet.conf