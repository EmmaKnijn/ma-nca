# Source: gha-runner-scale-set/templates/autoscalingrunnerset.yaml
apiVersion: actions.github.com/v1alpha1
kind: AutoscalingRunnerSet
metadata:
  name: arc-runner-set
  namespace: arc-runners
  labels:
    app.kubernetes.io/component: "autoscaling-runner-set"
    helm.sh/chart: gha-rs-0.9.3
    app.kubernetes.io/name: arc-runner-set
    app.kubernetes.io/instance: arc-runner-set
    app.kubernetes.io/version: "0.9.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: gha-rs
    actions.github.com/scale-set-name: arc-runner-set
    actions.github.com/scale-set-namespace: arc-runners
  annotations:
    actions.github.com/values-hash: 345a2650ad8e2da2703e8c142a3f52be0795d060055321aedf466dd0c1b0014
    actions.github.com/cleanup-manager-role-binding: arc-runner-set-gha-rs-manager
    actions.github.com/cleanup-manager-role-name: arc-runner-set-gha-rs-manager
    actions.github.com/cleanup-kubernetes-mode-role-binding-name: arc-runner-set-gha-rs-kube-mode
    actions.github.com/cleanup-kubernetes-mode-role-name: arc-runner-set-gha-rs-kube-mode
    actions.github.com/cleanup-kubernetes-mode-service-account-name: arc-runner-set-gha-rs-kube-mode
spec:
  githubConfigUrl: https://github.com/myorg/myrepo
  githubConfigSecret: pre-defined-secret
  runnerScaleSetName: arc-runner-set
  maxRunners: 10
  minRunners: 0

  template:
    spec:
      restartPolicy: Never
      serviceAccountName: arc-runner-set-gha-rs-kube-mode
      containers:
      - name: runner
        
        command: 
          - /home/runner/run.sh
        image: 
          ghcr.io/actions/actions-runner:latest
        env:
          - name: ACTIONS_RUNNER_CONTAINER_HOOKS
            value: /home/runner/k8s/index.js
          - name: ACTIONS_RUNNER_POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "true"
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
      
      volumes:
      
      - name: work
        ephemeral:
          volumeClaimTemplate:
            spec:
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 1Gi
              storageClassName: longhorn
