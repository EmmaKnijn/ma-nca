apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-web
  namespace: production
  labels:
    app: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      # Only needed while the GHCR package is private. Create it once with:
      #   kubectl create secret docker-registry ghcr-pull-secret \
      #     --docker-server=ghcr.io \
      #     --docker-username=<github-username> \
      #     --docker-password=<PAT with read:packages scope> \
      #     -n production
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: nginx
          # Placeholder — replace with your built image, e.g.
          # ghcr.io/<github-org-or-user>/<repo>:<tag>. Prefer a pinned tag
          # (a commit SHA or version) over :latest so rollouts are
          # deterministic and `kubectl rollout undo` actually means something.
          image: ghcr.io/innovatech/nginx-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5